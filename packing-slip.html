<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Packing Slips - Designer Homes</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; color: #1f2d3d; background: #f4f5f7; }
    header { padding: 12px 18px; background: #2C3E50; color: #fff; display: flex; gap: 10px; align-items: center; }
    header strong { flex: 1; }
    button { border: 1px solid #d8dde3; border-radius: 6px; padding: 7px 12px; background: #fff; cursor: pointer; }
    #msg { max-width: 900px; margin: 18px auto; color: #6c757d; }
    .slip { width: 8.5in; min-height: 11in; margin: 18px auto; padding: .5in; background: #fff; border: 1px solid #ddd; page-break-after: always; }
    .top { display: flex; justify-content: space-between; gap: 20px; border-bottom: 2px solid #2C3E50; padding-bottom: 14px; }
    .brand { font-weight: 700; font-size: 20px; color: #2C3E50; }
    .order { text-align: right; }
    h2 { margin: 18px 0 8px; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: #6c757d; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .addr { line-height: 1.45; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { padding: 9px 6px; border-bottom: 1px solid #e5e8ec; text-align: left; }
    th { font-size: 12px; color: #6c757d; text-transform: uppercase; }
    .check { width: 36px; font-size: 22px; }
    .muted { color: #6c757d; font-size: 13px; }
    .footer { margin-top: 30px; border-top: 1px solid #e5e8ec; padding-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media print {
      header, #msg { display: none; }
      body { background: #fff; }
      .slip { margin: 0; border: 0; width: auto; min-height: 10in; }
    }
  </style>
</head>
<body>
  <header><strong>Designer Homes Packing Slips</strong><button onclick="window.print()">Print</button></header>
  <div id="msg">Loading selected orders...</div>
  <main id="slips"></main>
  <script>
    'use strict';
    var TOKEN = sessionStorage.getItem('dh-book-admin-token') || '';
    var ids = new URLSearchParams(location.search).get('ids') || '';
    ids = ids.split(',').map(function (x) { return x.trim(); }).filter(Boolean);
    function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
    function money(c){return '$'+(Number(c||0)/100).toFixed(2);}
    async function api(action, payload) {
      var res = await fetch('/api/book-admin', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+TOKEN },
        body: JSON.stringify(Object.assign({ action: action }, payload||{}))
      });
      if (!res.ok) throw new Error(res.status === 401 ? 'Admin token required. Open book-admin.html first and log in.' : 'Could not load order.');
      return res.json();
    }
    function address(a) {
      if (!a) return '<span class="muted">No shipping address</span>';
      return '<div class="addr">'+esc(a.name||'')+'<br>'+esc(a.line1||'')+(a.line2?'<br>'+esc(a.line2):'')+'<br>'+esc([a.city,a.state].filter(Boolean).join(', '))+' '+esc(a.postal_code||'')+'<br>'+esc(a.country||'')+'</div>';
    }
    function slip(o) {
      var items = (o._items||[]).map(function (it) {
        return '<tr><td class="check">&#9633;</td><td>'+esc(it.name||it.product_id)+'</td><td>'+esc(it.sku||'')+'</td><td>'+Number(it.quantity||1)+'</td></tr>';
      }).join('');
      return '<section class="slip">'+
        '<div class="top"><div><div class="brand">Designer Homes Real Estate Services</div><div class="muted">Pride, Property & Power Book Order</div></div><div class="order"><strong>'+esc(o.order_number)+'</strong><br><span class="muted">'+new Date(o.created_at).toLocaleDateString()+'</span></div></div>'+
        '<div class="grid"><div><h2>Ship To</h2>'+address(o.shipping_address)+'</div><div><h2>Customer</h2>'+esc(o.customer_name||'')+'<br>'+esc(o.customer_email||'')+'<br>'+esc(o.customer_phone||'')+'</div></div>'+
        '<h2>Items To Pack</h2><table><thead><tr><th></th><th>Item</th><th>SKU</th><th>Qty</th></tr></thead><tbody>'+items+'</tbody></table>'+
        '<div class="footer"><div><h2>Fulfillment</h2>Status: '+esc(o.fulfillment_status||'')+'<br>Carrier: '+esc(o.shipping_carrier||'')+'<br>Tracking: '+esc(o.tracking_number||'')+'</div><div><h2>Order Total</h2>Subtotal '+money(o.subtotal_cents)+'<br>Shipping '+money(o.shipping_cents)+'<br><strong>Total '+money(o.total_cents)+'</strong></div></div>'+
        (o.admin_notes?'<h2>Notes</h2><p>'+esc(o.admin_notes)+'</p>':'')+
      '</section>';
    }
    (async function () {
      try {
        if (!ids.length) throw new Error('No orders selected.');
        var orders = [];
        for (const id of ids) orders.push((await api('get', { id: id })).order);
        document.getElementById('slips').innerHTML = orders.map(slip).join('');
        document.getElementById('msg').textContent = orders.length + ' packing slip(s) ready.';
      } catch (e) {
        document.getElementById('msg').textContent = e.message;
      }
    })();
  </script>
</body>
</html>
